name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build and upload, for example v2.0.0"
        required: true

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/scrl-fatedecision/
    permissions:
      id-token: write  # PyPI trusted publishing
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # The runners no longer provide Python 3.9. The wheel is pure Python, so the version that builds it does not
      # matter; the package still declares Python 3.9 or later.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build package
        run: python -m build

      - name: Check the built version against the tag
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          ls dist/
          test -f "dist/scrl_fatedecision-${TAG#v}.tar.gz"
          python -m twine check --strict dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
